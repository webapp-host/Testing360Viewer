<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>360 Existing / Proposed Viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#111}#app{height:100%;display:flex;flex-direction:column}#viewer{flex:1;min-height:0}.bar{height:72px;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 -2px 12px #0002;z-index:2}.btn{border:1px solid #bbb;background:#fff;padding:11px 22px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer}.btn.active{background:#28628e;border-color:#28628e;color:#fff}.label{position:absolute;top:16px;left:16px;z-index:3;background:#000a;color:#fff;padding:8px 12px;border-radius:6px;font-size:13px;letter-spacing:.03em}.hint{position:absolute;right:16px;top:16px;z-index:3;background:#0009;color:#fff;padding:8px 12px;border-radius:6px;font-size:12px}@media(max-width:600px){.hint{display:none}.bar{height:64px}.btn{padding:10px 18px}}
</style>
</head>
<body>
<div id="app">
  <div class="label" id="conditionLabel">EXISTING</div>
  <div class="hint">Drag to look around • Scroll to zoom</div>
  <div id="viewer"></div>
  <div class="bar">
    <button class="btn active" id="existingBtn">EXISTING</button>
    <button class="btn" id="proposedBtn">PROPOSED</button>
  </div>
</div>
<script>
const scenes={
 existing:{type:'equirectangular',panorama:'DZL__Location C_Existing.jpg'},
 proposed:{type:'equirectangular',panorama:'DZL__Location C_Proposed.jpg'}
};
const viewer=pannellum.viewer('viewer',{
 default:{firstScene:'existing',sceneFadeDuration:250,autoLoad:true,showControls:true},
 scenes
});
let active='existing';
function changeCondition(next){
 if(next===active)return;
 const yaw=viewer.getYaw();
 const pitch=viewer.getPitch();
 const hfov=viewer.getHfov();
 viewer.loadScene(next,pitch,yaw,hfov);
 active=next;
 document.getElementById('existingBtn').classList.toggle('active',next==='existing');
 document.getElementById('proposedBtn').classList.toggle('active',next==='proposed');
 document.getElementById('conditionLabel').textContent=next.toUpperCase();
}
document.getElementById('existingBtn').addEventListener('click',()=>changeCondition('existing'));
document.getElementById('proposedBtn').addEventListener('click',()=>changeCondition('proposed'));
</script>
</body>
</html>
